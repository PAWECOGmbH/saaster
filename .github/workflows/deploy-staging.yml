name: Deploy and Run Flyway Migrations staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  test:
    name: TestBox before staging
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify test runner failure handling
        run: bash www/tests/bin/check_test_runner.sh

      - name: Run isolated TestBox suite
        run: bash www/tests/bin/run_ci.sh

  deploy_and_migrate:
    needs: test
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify deployment file filters
        run: sh www/tests/bin/check_deployment_filters.sh

      - name: Deploy to server via rsync
        uses: Burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --checksum --delete --filter='merge .github/deploy.rsync-filter' --exclude-from='.gitignore' --exclude='/config/nginx/conf.d/custom.conf'
          path: ./
          remote_path: ${{ secrets.STAGING_REMOTE_PATH }}
          remote_host: ${{ secrets.STAGING_HOST }}
          remote_user: ${{ secrets.STAGING_USER }}
          remote_key: ${{ secrets.STAGING_KEY }}
          remote_key_pass: ${{ secrets.STAGING_KEY_PASS }}

      - name: Run Flyway Migrations core
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_KEY }}
          passphrase: ${{ secrets.STAGING_KEY_PASS }}
          script: |
            docker run --rm \
              --network npm_network \
              --volume ${{ secrets.STAGING_REMOTE_PATH }}/config/db/core:/flyway/core:ro \
              -e FLYWAY_URL="${{ secrets.STAGING_DB_URL }}" \
              -e FLYWAY_USER="${{ secrets.STAGING_DB_USER }}" \
              -e FLYWAY_PASSWORD="${{ secrets.STAGING_DB_PASSWORD }}" \
              flyway/flyway -locations=filesystem:/flyway/core -table=flyway_core migrate

      - name: Run Flyway Migrations myapp
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_KEY }}
          passphrase: ${{ secrets.STAGING_KEY_PASS }}
          script: |
            docker run --rm \
              --network npm_network \
              --volume ${{ secrets.STAGING_REMOTE_PATH }}/config/db/myapp:/flyway/myapp:ro \
              -e FLYWAY_URL="${{ secrets.STAGING_DB_URL }}" \
              -e FLYWAY_USER="${{ secrets.STAGING_DB_USER }}" \
              -e FLYWAY_PASSWORD="${{ secrets.STAGING_DB_PASSWORD }}" \
              flyway/flyway -locations=filesystem:/flyway/myapp -table=flyway_myapp migrate