upstream tomcat_backend {
    server 127.0.0.1:8888;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;
    root   /var/www;
    index  index.cfm index.html index.htm;
    server_name_in_redirect off;
    error_log /var/log/nginx/error_log warn;
    gzip on;
    gzip_types text/plain application/xml;
    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Only when the site is served over HTTPS: browsers then refuse plain http for a year.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~* \.(bmp|gif|jpeg|jpg|png|css|js|txt|xls|xlsx|csv|ico|swf|woff|woff2|ttf|otf|svg|webp|mp4|webm|ogg|pdf|doc|docx|ppt|pptx|zip|rar|7z)$ {
        expires max;
        log_not_found off;
    }

    location / {
        rewrite ^/(.+)$ /index.cfm/$1 last;
    }

    location ~* ^/userdata/.*\.(cfm|cfml|cfc|cfr|cfs|jsp|jspx)(/|$) {
        return 403;
    }

    location ~* Application.cf[mc]$ {
        return 404;
    }

    location ~* /lucee-server {
        return 404;
    }

    location ~* \.(cfm$|cfc$|cfm\/) {
        try_files @lucee @lucee;
    }

    location @lucee {

        proxy_pass http://tomcat_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

}
